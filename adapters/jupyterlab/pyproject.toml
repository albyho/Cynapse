[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "cynapse-jupyterlab-extension"
version = "0.10.2"
description = "Cynapse JupyterLab Adapter extension"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
only-include = ["cynapse_jupyterlab_extension/labextension"]

[tool.hatch.build.targets.wheel.shared-data]
"cynapse_jupyterlab_extension/labextension" = "share/jupyter/labextensions/cynapse-jupyterlab-adapter"
