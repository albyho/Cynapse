name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the VS Code Adapter VSIX to the Marketplace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A local release creates the tag and the release together, and that tag push
  # starts this workflow. Skip the whole build instead of overwriting the assets
  # the local build just uploaded.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release; skipping the build."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.released != 'true'
    uses: ./.github/workflows/verify.yml

  release:
    needs: [preflight, verify]
    if: needs.preflight.outputs.released != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check versions
        id: version
        shell: bash
        run: |
          version=$(node scripts/setVersion.mjs --check)
          echo "Workspace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v$version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # makeIcons.ps1 uses ffmpeg; the verify job installs it too.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - run: pnpm install --frozen-lockfile

      - name: Install JupyterLab extension build tool
        run: python -m pip install -r adapters/jupyterlab/requirements-build.txt

      - name: Test and package the Adapters
        run: |
          pnpm verify:adapter
          pnpm --filter cynapse-vscode-adapter package
          pnpm build:jupyterlab

      - name: Build the Client
        run: cargo build --release -p cynapse-client

      - name: Package the Windows bundle
        shell: pwsh
        run: |
          $version = node scripts/setVersion.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = "adapters/jupyterlab/dist/cynapse_jupyterlab_extension-$version-py3-none-any.whl"
          if (-not (Test-Path $wheel)) {
            throw "JupyterLab extension wheel is missing: $wheel"
          }
          $bundle = "dist/windows-x64"
          $zip = "dist/cynapse-$version-windows-x64.zip"
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "target/release/cynapse-client.exe" $bundle
          Copy-Item $wheel $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath $zip -Force
          $check = "dist/windows-x64-check"
          Remove-Item $check -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $check
          foreach ($name in @("cynapse-client.exe", (Split-Path $wheel -Leaf))) {
            if (-not (Test-Path (Join-Path $check $name))) {
              throw "Release zip is missing $name"
            }
          }

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Cynapse ${{ github.ref_name }}
          body: |
            Cynapse ${{ github.ref_name }} for Windows x64.

            - `cynapse-${{ steps.version.outputs.version }}-windows-x64.zip` — Client and JupyterLab Adapter

            Extract the zip and run `cynapse-client.exe`; the JupyterLab Adapter
            wheel is included beside it. The VS Code Adapter is distributed
            through the VS Code Marketplace.

            Built from Cynapse commit ${{ github.sha }}.
            Release log: https://github.com/albyho/Cynapse/blob/main/CHANGELOG.md
          files: |
            dist/cynapse-${{ steps.version.outputs.version }}-windows-x64.zip
          fail_on_unmatched_files: true

      - name: Publish the Adapter to the Marketplace
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set; add a Marketplace PAT as a repository secret." >&2
            exit 1
          fi
          pnpm --filter cynapse-vscode-adapter exec vsce publish \
            --no-dependencies \
            --packagePath dist/cynapse-vscode-adapter.vsix \
            -p "$VSCE_PAT"
