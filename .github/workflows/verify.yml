name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The project is Windows-first and GPUI needs the Windows desktop toolchain,
    # so the runner has to be Windows rather than a Linux container.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install JupyterLab extension build tool
        run: python -m pip install -r adapters/jupyterlab/requirements-build.txt

      - name: Verify stable gates
        run: pnpm verify:commit && pnpm verify:course && pnpm verify:client:core && pnpm verify:client:tests && pnpm verify:adapter && pnpm build:jupyterlab

      - name: Verify Client UI (advisory)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: pnpm verify:client:ui
