[package]
name = "cynapse-client"
version.workspace = true
edition = "2024"
rust-version = "1.100.0"
publish = false

[[bin]]
name = "cynapse-client"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
cynapse-client-core = { path = "../core" }
cynapse-client-i18n = { path = "../i18n" }
cynapse-client-model = { path = "../model" }
gpui-kit = "=0.9.1"
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-kit", "menu-state"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["tracing-log"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
futures = "0.3"
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
tempfile = "3"
