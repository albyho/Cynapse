[package]
name = "cynapse-client-model"
version.workspace = true
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
cynapse-client-core = { path = "../core" }
cynapse-client-i18n = { path = "../i18n" }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[dev-dependencies]
futures = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = "0.30"
