[package]
name = "cynapse-client-harness"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
cynapse-client-core = { path = "../core" }
cynapse-course = { path = "../../course" }
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }
