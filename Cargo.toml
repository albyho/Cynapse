[workspace]
resolver = "3"
members = [
  "course",
  "client/core",
  "client/harness",
  "client/model",
  "client/i18n",
  "client/app",
]
exclude = [
  "course/test-data/rust-book-zh-cn/workspace/hello_cargo",
]

[workspace.package]
version = "0.10.4"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
