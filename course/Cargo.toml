[package]
name = "cynapse-course"
version.workspace = true
edition = "2024"
rust-version = "1.100.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
